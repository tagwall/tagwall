name = "tagwall"
compatibility_date = "2026-05-03"

# Workers Static Assets + a thin Worker. The Worker (web/worker/index.js)
# serves the built canvas bundle from ./web/dist via the ASSETS binding, and
# adds one server-side route, /api/app-name, that resolves App Store / Play
# app names for the store-link labels (keeps the browser free of a JSONP
# script). Cloudflare's git integration runs the build below on every push.
#
# Pre-launch the directory was `./holding/` (static HTML placeholder);
# the holding/ folder is retained in-repo as historical reference but
# is no longer served.
main = "web/worker/index.js"

[build]
command = "npm --prefix web ci && npm --prefix web run build"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Per-chain paint snapshots, built incrementally by the cron below and served
# at /api/canvas/<chainId>/snapshot. Lets the browser render the historical
# canvas from one fetch instead of walking every Painted event from the deploy
# block and then reading back every pixel. See the snapshot section in
# web/worker/index.js for why that walk stopped being viable.
#
# Mirror operators: this id points at a namespace in the tagwall.io Cloudflare
# account, so `wrangler deploy` will reject it for you. Create your own with
# `wrangler kv namespace create SNAPSHOTS` and paste the id here. Dropping the
# binding entirely also works: the snapshot route then answers 503 and the
# frontend falls back to scanning from the deploy block, which is what it did
# before snapshots existed.
[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "2a4a62f0a5e94d92839be683e4d81443"

# Snapshot builder. Each run advances every chain's scan by a bounded number
# of subrequests, so a cold backfill converges over successive runs rather
# than blowing the per-invocation subrequest cap. Two minutes is chosen for
# the initial backfill; once every chain reports complete:true this can be
# relaxed (the frontend scans forward from snapshotBlock, so snapshot lag
# never hides a new paint).
[triggers]
crons = ["*/2 * * * *"]
